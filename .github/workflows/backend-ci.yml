name: Backend CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  lint-and-security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install flake8 bandit pip-audit

    - name: Lint with flake8
      run: |
        echo "Running flake8 linting..."
        # Exit on errors and warnings
        flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit on style issues (less strict)
        flake8 backend/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: false

    - name: Security scan with bandit
      run: |
        echo "Running security scan (bandit)..."
        bandit -r backend/ -f json -o /tmp/bandit-report.json || true
        bandit -r backend/ -f txt
      continue-on-error: false

    - name: Check dependencies with pip-audit
      run: |
        echo "Checking for vulnerable dependencies (pip-audit)..."
        pip-audit --desc
      continue-on-error: false

    - name: Summary
      if: always()
      run: |
        echo "CI/CD Pipeline Check Complete"
        echo "Checks run on Python ${{ matrix.python-version }}"